name: Public AUR thermalright-trcc-git

on:
  push:
    paths:
        - "thermalright-trcc-git/PKGBUILD"
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/validate-package.yml
    with:
      package: thermalright-trcc-git

  public_aur:
    needs: validate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: thermalright-trcc-git
          pkgbuild: thermalright-trcc-git/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update AUR thermalright-trcc-git package
          ssh_keyscan_types: rsa,ecdsa,ed25519
          # updpkgsums: true
